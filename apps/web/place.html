<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brass Charter: place equipment</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d1a17; color: #e8dfd0; font: 13px/1.4 system-ui, sans-serif; }
      #app { display: flex; height: 100%; }
      #view { flex: 1; min-width: 0; position: relative; }
      #view canvas { display: block; }
      #panel { width: 360px; box-sizing: border-box; padding: 12px 14px; overflow-y: auto; background: #26221e; border-left: 1px solid #3a342d; }
      h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .04em; }
      h2 { font-size: 12px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .08em; color: #b9a98f; }
      label { display: block; }
      select, input[type=text], textarea, button { background: #1d1a17; color: inherit; border: 1px solid #4a4238; border-radius: 3px; padding: 3px 6px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: #b98f4a; }
      .row { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
      .row > span.k { width: 54px; color: #b9a98f; }
      .row input[type=range] { flex: 1; min-width: 0; }
      .row input[type=number] { width: 66px; background: #1d1a17; color: inherit; border: 1px solid #4a4238; border-radius: 3px; padding: 2px 4px; }
      .loadout .row > span.k { width: 62px; }
      .loadout input[type=text] { flex: 1; min-width: 0; }
      #items label { padding: 3px 4px; border-radius: 3px; cursor: pointer; }
      #items label:hover { background: #312b25; }
      #items input { margin-right: 6px; }
      .hint { color: #8d8272; font-size: 12px; }
      .banner { background: #4a3a1c; border: 1px solid #b98f4a; padding: 6px 8px; border-radius: 3px; margin-bottom: 10px; }
      textarea { width: 100%; box-sizing: border-box; height: 160px; font: 11px/1.3 ui-monospace, monospace; }
      .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div id="panel"></div>
    </div>
    <script type="module" src="/src/model/placeTool.ts"></script>
  </body>
</html>
